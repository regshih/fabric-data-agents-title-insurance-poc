[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-iq-title-insurance-poc"
version = "0.1.0"
description = "Synthetic Microsoft Fabric IQ title-insurance POC"
requires-python = ">=3.10"
dependencies = [
  "azure-identity>=1.17",
  "azure-storage-file-datalake>=12.17",
  "pandas>=2.2",
  "pyarrow>=17",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
agent = ["mcp==2.3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["title_iq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821"]
